# Debug config for 1B MoE (small scale to verify pipeline)
# Uses the EXACT same 1B architecture as final (just fewer steps + tiny dataset subset)

model:
  vocab_size: 129280    # MUST match tokenizer
  hidden_size: 768
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 1
  head_dim: 128
  qk_rope_head_dim: 32
  q_lora_rank: 384
  o_groups: 4
  o_lora_rank: 192
  moe_intermediate_size: 2048
  n_routed_experts: 12
  n_shared_experts: 2
  num_experts_per_tok: 2
  scoring_func: "sqrtsoftplus"
  hc_mult: 2
  hc_sinkhorn_iters: 2
  max_position_embeddings: 8192
  rope_theta: 100000.0

training:
  dataset_path: "data/processed/1b_moe_data_ready/final_train"
  val_dataset_path: "data/processed/1b_moe_data_ready/val"

  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  max_steps: 12                    # very short debug run
  logging_steps: 2
  save_steps: 6
  bf16: false  # Use fp32 - bf16 causes NaN with HC architecture (see BUG_FIXES.md)
  gradient_checkpointing: true
  optim: "adamw_torch"
  torch_compile: true
  torch_compile_mode: "reduce-overhead"
  max_seq_length: 2048

  qat:
    enabled: false               # disable for first debug

  report_to: ["none"]
  dataloader_num_workers: 2
  seed: 42