# =============================================================================
# nanowhale 1B MoE — Colab-Optimized Config (H100/A100, 256k context)
# Target: ~1.2B total / ~400M active params (12 experts, top-2)
# Hardware: H100/A100 80GB, ~70GB usable VRAM
# No DeepSpeed needed — model fits comfortably
# =============================================================================

model:
  vocab_size: 128000
  hidden_size: 768
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 1
  head_dim: 128
  qk_rope_head_dim: 32
  q_lora_rank: 384
  o_groups: 4
  o_lora_rank: 192
  moe_intermediate_size: 2048
  n_routed_experts: 12
  n_shared_experts: 2
  num_experts_per_tok: 2
  scoring_func: "sqrtsoftplus"
  hc_mult: 2
  hc_sinkhorn_iters: 2
  swiglu_limit: 10.0
  num_hash_layers: 2
  max_position_embeddings: 262144           # 256k target
  rope_theta: 500000.0
  rms_norm_eps: 1e-6
  initializer_range: 0.02
  hidden_act: "silu"
  pad_token_id: 0
  bos_token_id: 0
  eos_token_id: 1
  tie_word_embeddings: false

# =============================================================================
# Colab-Optimized Training Settings (H100 80GB / A100 80GB)
# No DeepSpeed — model is small enough to fit without sharding
# =============================================================================
training:
  # --- Data ---
  dataset_path: "/content/nanowhale/data/processed/1b_moe_reasoning"  # colab path
  max_seq_length: 262144                    # 256k target

  # --- Curriculum context (critical for 256k) ---
  curriculum:
    enabled: true
    stages:
      - { steps: 0,     seq_len: 4096 }
      - { steps: 1000,  seq_len: 8192 }
      - { steps: 3000,  seq_len: 32768 }
      - { steps: 8000,  seq_len: 65536 }
      - { steps: 15000, seq_len: 131072 }
      - { steps: 25000, seq_len: 262144 }

  # --- Batch (big for H100/A100 80GB) ---
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16           # effective batch = 64

  # --- Optimizer ---
  learning_rate: 3.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  optim: "adamw_torch_fused"

  # --- Precision ---
  bf16: true

  # --- Training schedule ---
  max_steps: 50000
  save_steps: 5000
  logging_steps: 20
  eval_steps: 2000

  # --- Compile (massive speedup on H100) ---
  torch_compile: true
  torch_compile_mode: "reduce-overhead"

  # --- Memory ---
  gradient_checkpointing: true
  dataloader_num_workers: 4
  seed: 42

  # --- QAT (selective, experts only) ---
  qat:
    enabled: false                           # enable at step ~35000 for final 30%
    start_step: 35000
    target_modules: "experts_only"
    group_size: 128
    bits: 4