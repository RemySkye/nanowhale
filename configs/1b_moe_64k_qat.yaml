# =============================================================================
# nanowhale 1B MoE Configuration - 64k Context + Selective QAT
# Target: ~1.05B total params / ~400M active params
# Goal: Beat Qwen3.5-0.8B with 2x inference speed via MoE sparsity
# Hardware: RTX 3080 Ti (11GB usable) + DeepSpeed ZeRO-3 + MXFP8 experts
# =============================================================================

model:
  # === Core Model (optimized for 3080 Ti) ===
  vocab_size: 49152                    # Reduced from 129k → saves ~75M params
  hidden_size: 1152
  num_hidden_layers: 22
  max_position_embeddings: 131072      # 128k target with YaRN + CSA

  # MLA (Multi-head Latent Attention) - memory efficient
  num_attention_heads: 16
  num_key_value_heads: 1
  head_dim: 128
  qk_rope_head_dim: 32
  q_lora_rank: 640
  o_groups: 4
  o_lora_rank: 320
  sliding_window: 4096

  # MoE (target ~400M active, 16 experts, top-2)
  moe_intermediate_size: 3072
  n_routed_experts: 16
  n_shared_experts: 2
  num_experts_per_tok: 2
  scoring_func: "sqrtsoftplus"
  routed_scaling_factor: 1.0
  num_hash_layers: 4
  swiglu_limit: 10.0

  # Hyper-Connections (stability critical at small scale)
  hc_mult: 2                             # Reduced from 4 → better stability + lower memory
  hc_sinkhorn_iters: 3

  # Long context scaling
  rope_theta: 100000.0
  rope_scaling:
    type: "yarn"
    factor: 32
    original_max_position_embeddings: 4096
    beta_fast: 32
    beta_slow: 1.0

  # === Standard params ===
  hidden_act: "silu"
  rms_norm_eps: 1e-6
  initializer_range: 0.02
  pad_token_id: 0
  bos_token_id: 0
  eos_token_id: 1
  tie_word_embeddings: false
  attention_bias: false
  attention_dropout: 0.0


training:
  # === Dataset ===
  dataset_path: "data/processed/1b_moe_data_ready/final_train"
  val_dataset_path: "data/processed/1b_moe_data_ready/val"
  max_seq_length: 65536                  # Start at 8k-32k curriculum, go to 64k+

  # === Optimizer & Memory (RTX 3080 Ti optimized) ===
  per_device_train_batch_size: 1         # Very aggressive - rely on ZeRO-3 + gradient accumulating
  gradient_accumulation_steps: 64        # Effective batch ~64
  learning_rate: 1.5e-4                  # Lower LR for large MoE
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  optim: "adamw_bnb_8bit"                # 8-bit AdamW - critical for 11GB VRAM

  # === Precision & Speed ===
  bf16: true                             # Use bf16 where stable (will fallback for HC if NaN)
  fp16: false
  torch_compile: true
  torch_compile_mode: "reduce-overhead"

  # === Gradient Checkpointing + DeepSpeed ===
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

  use_deepspeed: true
  deepspeed_config: "configs/deepspeed_zero3_3080ti.json"

  # === Training Schedule ===
  max_steps: 25000
  save_steps: 2000
  logging_steps: 20
  eval_steps: 1000

  # === Curriculum Context Length (very important for 64k+) ===
  curriculum:
    enabled: true
    stages:
      - {steps: 5000, seq_length: 8192}
      - {steps: 10000, seq_length: 32768}
      - {steps: 25000, seq_length: 65536}

  # === QAT Configuration (Selective) ===
  qat:
    enabled: true
    start_step: 18000                    # Start QAT at ~72% of training
    fake_quant_after_n_steps: 0          # Or use delayed start inside torchao
    target_modules: "experts_only"       # Only quantize expert linears
    quantization_config:
      type: "int8_dynamic_act_int4_weight"   # Or use MXFP8 experts via torchao
      group_size: 128
      bits: 4

  seed: 42
  report_to: ["none"]                    # Change to "wandb" or "trackio" if available
  disable_tqdm: true
  dataloader_num_workers: 8
  dataloader_pin_memory: true